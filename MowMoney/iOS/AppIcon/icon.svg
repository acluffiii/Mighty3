<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Mow Money app icon. Flat fills, ink outlines, square corners (iOS rounds them). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd86e"/>
      <stop offset="0.55" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <clipPath id="lawnClip">
      <rect x="0" y="600" width="1024" height="424"/>
    </clipPath>
  </defs>

  <!-- sky and sun -->
  <rect width="1024" height="1024" fill="url(#sky)"/>
  <circle cx="790" cy="250" r="150" fill="#ffe9a3" opacity="0.55"/>
  <circle cx="790" cy="250" r="105" fill="#fff4c4"/>

  <!-- dunes -->
  <path d="M0 560 Q 180 500 380 548 T 760 530 T 1024 540 V 640 H 0 Z" fill="#f3d596"/>
  <path d="M0 600 Q 260 548 560 590 T 1024 575 V 640 H 0 Z" fill="#e6bd72"/>

  <!-- small pyramid -->
  <g stroke="#15291a" stroke-width="10" stroke-linejoin="round">
    <polygon points="236,440 150,576 262,576" fill="#c98f52"/>
    <polygon points="236,440 262,576 332,576" fill="#f2cf86"/>
  </g>
  <g stroke="#15291a" stroke-width="4" opacity="0.35">
    <line x1="214" y1="475" x2="249" y2="475"/>
    <line x1="192" y1="510" x2="253" y2="510"/>
    <line x1="170" y1="545" x2="258" y2="545"/>
    <line x1="247" y1="475" x2="269" y2="475"/>
    <line x1="251" y1="510" x2="293" y2="510"/>
    <line x1="256" y1="545" x2="316" y2="545"/>
  </g>

  <!-- striped lawn sweeping toward the viewer -->
  <rect x="0" y="600" width="1024" height="424" fill="#6cb041"/>
  <g clip-path="url(#lawnClip)" fill="#a4dc6c">
    <polygon points="512,420 -760,1024 -440,1024"/>
    <polygon points="512,420 -120,1024 200,1024"/>
    <polygon points="512,420 520,1024 840,1024"/>
    <polygon points="512,420 1160,1024 1480,1024"/>
  </g>
  <rect x="0" y="596" width="1024" height="14" fill="#15291a"/>

  <g transform="translate(530 760) scale(1.12) translate(-530 -760)">
  <!-- shadow -->
  <ellipse cx="530" cy="922" rx="340" ry="36" fill="#15291a" opacity="0.28"/>

  <!-- grass clippings spraying from the deck -->
  <g fill="#5fbf3a" stroke="#15291a" stroke-width="6" stroke-linejoin="round">
    <rect x="170" y="835" width="46" height="18" rx="6" transform="rotate(-25 193 844)"/>
    <rect x="110" y="780" width="40" height="16" rx="6" transform="rotate(20 130 788)"/>
    <rect x="190" y="760" width="36" height="15" rx="6" transform="rotate(-50 208 767)"/>
    <rect x="95" y="870" width="42" height="16" rx="6" transform="rotate(10 116 878)"/>
  </g>

  <g stroke="#15291a" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <!-- mower deck -->
    <rect x="270" y="830" width="470" height="56" rx="24" fill="#5d635d"/>

    <!-- body and hood -->
    <path d="M250 840 V 770 Q 250 742 278 742 H 560 L 606 688 H 770 Q 812 688 818 730 L 836 840 Z" fill="#e2412f"/>
    <path d="M618 716 H 766 Q 790 716 794 740" fill="none" stroke="#ff7a61" stroke-width="16"/>
    <rect x="800" y="752" width="30" height="60" rx="8" fill="#23272a" stroke-width="10"/>

    <!-- seat -->
    <path d="M292 742 V 630 Q 292 606 318 606 H 336 Q 356 606 356 630 V 700 H 452 Q 470 700 470 718 V 742 Z" fill="#23272a"/>

    <!-- steering column -->
    <line x1="590" y1="720" x2="548" y2="598" fill="none" stroke-width="18"/>

    <!-- rider: jeans -->
    <path d="M372 700 L 520 690 L 540 812" fill="none" stroke="#15291a" stroke-width="64"/>
    <path d="M372 700 L 520 690 L 540 812" fill="none" stroke="#2f5595" stroke-width="40"/>
    <!-- boot -->
    <path d="M512 800 H 574 Q 596 800 596 822 V 836 H 512 Z" fill="#6b3f22"/>

    <!-- shirt -->
    <path d="M338 700 Q 330 600 364 560 Q 400 530 452 552 Q 482 570 480 620 L 470 706 Z" fill="#3f8ad6"/>
    <line x1="410" y1="560" x2="404" y2="700" fill="none" stroke-width="6" opacity="0.5"/>

    <!-- arm reaching to the wheel -->
    <path d="M448 580 Q 500 610 548 600" fill="none" stroke="#15291a" stroke-width="54"/>
    <path d="M448 580 Q 500 610 548 600" fill="none" stroke="#3f8ad6" stroke-width="30"/>

    <!-- steering wheel and hand -->
    <ellipse cx="546" cy="596" rx="58" ry="18" fill="none" stroke="#15291a" stroke-width="26" transform="rotate(-22 546 596)"/>
    <ellipse cx="546" cy="596" rx="58" ry="18" fill="none" stroke="#3a3f3a" stroke-width="10" transform="rotate(-22 546 596)"/>
    <circle cx="552" cy="600" r="24" fill="#8a5434" stroke-width="10"/>

    <!-- neck and head -->
    <rect x="392" y="500" width="44" height="60" rx="14" fill="#7a4a2d" stroke-width="10"/>
    <circle cx="414" cy="474" r="66" fill="#8a5434"/>
    <circle cx="352" cy="480" r="16" fill="#8a5434" stroke-width="10"/>
  </g>

  <!-- face -->
  <!-- sunglasses -->
  <g stroke="#15291a" stroke-linejoin="round" stroke-linecap="round">
    <line x1="412" y1="458" x2="364" y2="472" stroke-width="8"/>
    <line x1="448" y1="456" x2="462" y2="456" stroke-width="8"/>
    <path d="M410 448 H 450 V 462 Q 450 478 432 478 H 426 Q 410 478 410 462 Z" fill="#1d2b33" stroke-width="7"/>
    <path d="M460 448 H 494 V 462 Q 494 478 478 478 H 474 Q 460 478 460 462 Z" fill="#1d2b33" stroke-width="7"/>
  </g>
  <g fill="#ffffff" opacity="0.7">
    <rect x="417" y="453" width="12" height="5" rx="2"/>
    <rect x="466" y="453" width="11" height="5" rx="2"/>
  </g>
  <path d="M478 470 Q 490 486 474 490" fill="none" stroke="#15291a" stroke-width="7" stroke-linecap="round"/>
  <path d="M424 500 Q 452 530 482 504 Q 454 516 424 500 Z" fill="#ffffff" stroke="#15291a" stroke-width="8" stroke-linejoin="round"/>
  <circle cx="448" cy="486" r="10" fill="#b0664a" opacity="0.5"/>
  <!-- straw in his mouth -->
  <path d="M474 506 L 572 478" fill="none" stroke="#15291a" stroke-width="18" stroke-linecap="round"/>
  <path d="M474 506 L 572 478" fill="none" stroke="#f0cf5a" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#15291a" stroke-width="5" stroke-linecap="round">
    <line x1="560" y1="481" x2="574" y2="464"/>
    <line x1="560" y1="481" x2="580" y2="490"/>
    <line x1="548" y1="485" x2="558" y2="468"/>
  </g>

  <!-- cowboy hat -->
  <g transform="translate(0 -38)">
  <g stroke="#15291a" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
    <path d="M354 440 Q 346 360 384 346 Q 414 358 444 344 Q 482 360 474 440 Z" fill="#c98a45"/>
    <path d="M352 420 H 476 V 440 H 352 Z" fill="#5a3522" stroke-width="10"/>
    <path d="M276 420 Q 300 452 414 452 Q 528 452 556 414 Q 540 470 414 470 Q 290 470 276 420 Z" fill="#d99b55"/>
  </g>
  <path d="M388 362 Q 414 376 440 360" fill="none" stroke="#15291a" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- wheels on the near side -->
  <g stroke="#15291a" stroke-width="14">
    <circle cx="330" cy="850" r="96" fill="#1f2320"/>
    <circle cx="330" cy="850" r="40" fill="#c9ccc4"/>
    <circle cx="768" cy="876" r="56" fill="#1f2320"/>
    <circle cx="768" cy="876" r="22" fill="#c9ccc4" stroke-width="10"/>
  </g>
  <g fill="#15291a">
    <circle cx="330" cy="850" r="11"/>
    <circle cx="768" cy="876" r="7"/>
  </g>
  <path d="M258 806 A 96 96 0 0 1 300 762" fill="none" stroke="#4a504a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
