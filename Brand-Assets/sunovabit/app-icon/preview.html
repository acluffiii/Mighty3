<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunovabit App Icon</title>
<style>
body{margin:0;font:15px/1.5 -apple-system,system-ui,sans-serif;background:#f4f1ea;color:#17202e;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#5a6474;margin:0 0 20px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.wall{flex:1 1 420px;border-radius:28px;padding:28px;display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.light{background:linear-gradient(160deg,#ffd9b8,#f7a072 45%,#c96b8a)}
.dark{background:linear-gradient(160deg,#0b1020,#1b2a4a 50%,#3a1e3a)}
figure{margin:0;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
figure img{display:block;margin:0 auto 6px;border-radius:22.37%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.master{margin-top:24px;display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.master > img{width:min(320px,100%);border-radius:22.37%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.fav{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;background:#fff;border:1px solid #e4dccd;border-radius:12px;padding:12px 16px}
</style></head><body>
<h1>Sunovabit app icon: Juneteenth Nova</h1>
<p class="sub">iOS rounds the corners itself. The PNG you upload stays square and opaque.</p>
<div class="row">
  <div class="wall light">
    <figure><img src="AppIcon-1024.png" width="180" height="180" alt="">180 · Home Screen @3x</figure>
    <figure><img src="AppIcon-1024.png" width="120" height="120" alt="">120</figure>
    <figure><img src="AppIcon-1024.png" width="60" height="60" alt="">60 · actual size</figure>
    <figure><img src="AppIcon-1024.png" width="40" height="40" alt="">40 · Spotlight</figure>
  </div>
  <div class="wall dark">
    <figure><img src="AppIcon-1024.png" width="180" height="180" alt="">180</figure>
    <figure><img src="AppIcon-1024.png" width="120" height="120" alt="">120</figure>
    <figure><img src="AppIcon-1024.png" width="60" height="60" alt="">60</figure>
    <figure><img src="AppIcon-1024.png" width="40" height="40" alt="">40</figure>
  </div>
</div>
<div class="master">
  <img src="AppIcon-1024.png" alt="Sunovabit app icon master">
  <div>
    <p><b>Browser-tab icons</b> (simplified version, no circuit traces):</p>
    <div class="fav"><img src="sizes/icon-16.png" width="16" height="16" alt=""><img src="sizes/icon-32.png" width="32" height="32" alt=""><img src="sizes/icon-48.png" width="48" height="48" alt=""><img src="sizes/icon-64.png" width="64" height="64" alt=""><span>16 · 32 · 48 · 64</span></div>
  </div>
</div>
</body></html>
