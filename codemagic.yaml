workflows:
  dentdog-simulator-preview:
    name: DentDOG — Simulator Build + Screenshot
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.cluffwork.haildeck"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: |
          cd Swift
          xcodegen generate

      - name: Build for iOS Simulator
        script: |
          cd Swift
          # Pick whatever iPhone simulator is available on this machine
          SIM_NAME=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{print $1}' | tail -1 | xargs)
          echo "Building for: $SIM_NAME"
          xcodebuild \
            -project DentDOG.xcodeproj \
            -scheme DentDOG \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build \
            build

      - name: Boot simulator, install, launch, screenshot
        script: |
          cd Swift
          SIM_NAME=$(xcrun simctl list devices available | awk -F'[()]' '/iPhone/{print $1}' | tail -1 | xargs)
          SIM_UDID=$(xcrun simctl list devices available | grep "$SIM_NAME" | grep -oE '[A-F0-9-]{36}' | head -1)
          echo "Simulator: $SIM_NAME ($SIM_UDID)"
          APP_PATH=$(find build -name "DentDOG.app" | head -n1)
          echo "App path: $APP_PATH"

          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          open -a Simulator
          sleep 5

          # iOS 26 Simulator rejects widget .appex placeholder creation — strip it
          # before install. The screenshot only needs the main app.
          rm -rf "$APP_PATH/PlugIns/"
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          # Launch with console output captured so crashes are visible in the log
          xcrun simctl launch --console-pty "$SIM_UDID" "$BUNDLE_ID" &
          LAUNCH_PID=$!
          sleep 25

          # Check if the app process is still running (not crashed)
          RUNNING=$(xcrun simctl spawn "$SIM_UDID" launchctl list 2>/dev/null | grep "$BUNDLE_ID" || echo "NOT RUNNING")
          echo "App status after 25s: $RUNNING"

          # Collect any crash logs
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          ls "$CRASH_DIR"/*.crash 2>/dev/null && cp "$CRASH_DIR"/*.crash . || echo "No crash logs"

          xcrun simctl io "$SIM_UDID" screenshot "$HOME/dentdog_preview.png"
          cp "$HOME/dentdog_preview.png" dentdog_preview.png

    artifacts:
      - Swift/build/**/*.app
      - Swift/dentdog_preview.png
      - Swift/*.crash

# Notes:
# - This workflow only needs a free Codemagic account — no Apple Developer Program
#   enrollment, no signing certificates. Simulator builds don't require code signing.
# - Output: dentdog_preview.png in the build artifacts tab — an actual screenshot
#   of the running app, viewable from any device.
# - To install on a physical iPhone instead of just previewing, you'll need an
#   Apple Developer account ($99/yr) and to add code signing in the Codemagic
#   dashboard (Team settings → Code signing identities). That's a separate step
#   from this one — this workflow is just for seeing it run.
